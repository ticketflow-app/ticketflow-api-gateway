server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # CORS: el frontend (http://localhost:8081) llama al gateway (http://localhost:8080)
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:8081"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                allow-credentials: true
          x-forwarded:
            enabled: true
          routes:
            # Ruta hacia el microservicio de Usuarios
            - id: user-service
              # lb:// = resuelto vía Eureka; se puede forzar una URL directa con USER_SERVICE_URI (dev sin Eureka)
              uri: ${USER_SERVICE_URI:lb://ticketflow-user-service}
              predicates:
                - Path=/api/auth/**,/api/usuarios,/api/usuarios/**,/register,/login,/me,/users/**
              filters:
                # 1. Circuit Breaker
                - name: CircuitBreaker
                  args:
                    name: userCircuitBreaker
                    fallbackUri: forward:/fallback/users
                # 2. Rate Limiter (Redis) - protege contra abuso
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 10 # Peticiones por segundo permitidas
                    redis-rate-limiter.burstCapacity: 20 # Ráfaga máxima permitida
                    redis-rate-limiter.requestedTokens: 1

            # Ruta hacia el microservicio de Inventario (reservas y disponibilidad)
            - id: inventory-service
              # lb:// = resuelto vía Eureka; se puede forzar una URL directa con INVENTORY_SERVICE_URI (dev sin Eureka)
              uri: ${INVENTORY_SERVICE_URI:lb://ticketflow-inventory-service}
              predicates:
                - Path=/api/inventario/**,/api/reservas,/api/reservas/**,/api/boletos/**,/events/*/availability,/reservations,/reservations/**
              filters:
                - RewritePath=/api/inventario/eventos/(?<eventId>[^/]+)/disponibilidad, /events/${eventId}/availability
                - RewritePath=/api/reservas, /reservations
                - RewritePath=/api/reservas/(?<segment>.*), /reservations${segment}
                - RewritePath=/api/boletos/(?<segment>.*), /boletos/${segment}
                # 1. Circuit Breaker
                - name: CircuitBreaker
                  args:
                    name: inventoryCircuitBreaker
                    fallbackUri: forward:/fallback/inventory
                # 2. Rate Limiter (Redis)
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1

            # Ruta hacia el microservicio de Catálogo (eventos, recintos, localidades)
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URI:lb://ticketflow-catalog-service}
              predicates:
                - Path=/api/eventos/**,/api/eventos,/api/recintos/**,/api/localidades/**,/api/organizador/**
              filters:
                # 1. Circuit Breaker
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    fallbackUri: forward:/fallback/catalog
                # 2. Rate Limiter (Redis) — 50/s en lecturas de catálogo
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    redis-rate-limiter.requestedTokens: 1

  # Configuración de conexión a Redis (para el Rate Limiter)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Descubrimiento de servicios: el gateway es un cliente de Eureka
eureka:
  client:
    # Desactivar en dev local si aún no hay eureka-server (EUREKA_ENABLED=false)
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: true

# Configuración de resiliencia (Circuit Breaker + timeouts)
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      userCircuitBreaker:
        base-config: default
      inventoryCircuitBreaker:
        base-config: default
      catalogCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
    instances:
      userCircuitBreaker:
        base-config: default
      inventoryCircuitBreaker:
        base-config: default
      catalogCircuitBreaker:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    gateway:
      access: read-only

# Secreto compartido con user-service para validar el JWT (debe coincidir con jwt.secret de user-service)
jwt:
  secret: ${JWT_SECRET:ticketflow-dev-secret-key-change-me-in-production-2026}